---
- name: llama.settings.require | Validate build and service settings
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == '26.04'
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.user_id != 'root'
      - llama_backend in ['vulkan', 'hip']
      - llama_flash_attention in ['on', 'off', 'auto']
      - llama_cache_k in ['f16', 'q8_0', 'q4_0']
      - llama_cache_v in ['f16', 'q8_0', 'q4_0']
      - llama_cache_v == 'f16' or llama_flash_attention == 'on'
      - llama_parallel | int > 0
      - llama_context | int % llama_parallel | int == 0
      - llama_context | int // llama_parallel | int <= 262144
      - llama_ubatch | int > 0 and llama_ubatch | int <= 2048
      - llama_ctx_checkpoints | int >= 0
      - llama_cache_ram | int >= 0
      - llama_mtp_tokens | int > 0
      - not llama_mtp | bool or llama_backend == 'vulkan'
      - llama_mmproj_file is match('^[A-Za-z0-9_.-]+\.gguf$')
      - llama_mtp_file is match('^[A-Za-z0-9_.-]+\.gguf$')
      - llama_mmproj_url is match('^https://')
      - llama_mtp_url is match('^https://')
      - llama_mmproj_sha256 is match('^[0-9a-f]{64}$')
      - llama_mtp_sha256 is match('^[0-9a-f]{64}$')
      - llama_hip_arch is match('^gfx[0-9a-f]+$')
      - llama_commit is match('^[0-9a-f]{40}$')
      - llama_model_sha256 is match('^[0-9a-f]{64}$')
      - llama_source_dir is match('^/opt/[A-Za-z0-9_.-]+$')
      - llama_model_dir is match('^/opt/models/[A-Za-z0-9_.-]+$')
      - llama_state_dir is match('^/var/lib/[A-Za-z0-9_.-]+$')
      - llama_model_file is match('^[A-Za-z0-9_.-]+\.gguf$')
      - llama_model_alias is match('^[A-Za-z0-9_.-]+$')
      - llama_service_user is match('^[a-z_][a-z0-9_-]*$')
      - llama_service_user != 'root'
      - llama_model_url is match('^https://')
      - llama_build_jobs | int > 0
      - llama_context | int >= 512
      - llama_port | int > 1024 and llama_port | int < 65536

- name: llama.prerequisites.inspect | Read installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: llama.prerequisites.require | Require the base developer installation
  ansible.builtin.assert:
    that:
      - "['build-essential', 'cmake', 'ninja-build', 'git', 'curl', 'libssl-dev', 'libvulkan-dev', 'glslc', 'spirv-headers', 'mesa-vulkan-drivers', 'rocm-dev'] | difference(ansible_facts.packages.keys() | list) | length == 0"
    fail_msg: Install and verify rocm.md / site.yml first.

- name: llama.compiler.locate | Locate the Ubuntu HIP compiler and runtime
  ansible.builtin.command:
    argv: [hipconfig, "{{ item }}"]
  loop: ['-l', '-R']
  register: llama_hip_paths
  changed_when: false
  check_mode: false

- name: llama.source.prepare | Prepare the source directory
  ansible.builtin.file:
    path: "{{ llama_source_dir }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    mode: '0755'
  become: true

- name: llama.source.checkout | Check out the pinned llama.cpp revision
  ansible.builtin.git:
    repo: https://github.com/ggml-org/llama.cpp.git
    dest: "{{ llama_source_dir }}"
    version: "{{ llama_commit }}"
    depth: 1
    refspec: "{{ llama_commit }}"
  register: llama_source

- name: llama.source.require | Verify the source commit
  ansible.builtin.assert:
    that: llama_source.after == llama_commit
  when: not ansible_check_mode

- name: llama.vulkan.configure | Configure the Vulkan build
  ansible.builtin.command:
    argv:
      - cmake
      - -S
      - "{{ llama_source_dir }}"
      - -B
      - "{{ llama_source_dir }}/build-vulkan"
      - -G
      - Ninja
      - -DCMAKE_BUILD_TYPE=Release
      - -DGGML_VULKAN=ON
  changed_when: false
  when: not ansible_check_mode

- name: llama.vulkan.build | Build the Vulkan binaries
  ansible.builtin.command:
    argv: [cmake, --build, "{{ llama_source_dir }}/build-vulkan", --target, llama-server, llama-cli, llama-bench, -j, "{{ llama_build_jobs | string }}"]
  register: llama_vulkan_build
  changed_when: llama_vulkan_build.stdout is search('(?m)^\[[0-9]+/[0-9]+\] (Building|Linking) ')
  notify: Restart llama
  when: not ansible_check_mode

- name: llama.hip.configure | Configure the HIP build
  ansible.builtin.command:
    argv:
      - cmake
      - -S
      - "{{ llama_source_dir }}"
      - -B
      - "{{ llama_source_dir }}/build-hip"
      - -G
      - Ninja
      - -DCMAKE_BUILD_TYPE=Release
      - -DGGML_HIP=ON
      - "-DAMDGPU_TARGETS={{ llama_hip_arch }}"
  environment:
    HIPCXX: "{{ llama_hip_paths.results[0].stdout | trim }}/clang"
    HIP_PATH: "{{ llama_hip_paths.results[1].stdout | trim }}"
  changed_when: false
  when: not ansible_check_mode

- name: llama.hip.build | Build the HIP binaries
  ansible.builtin.command:
    argv: [cmake, --build, "{{ llama_source_dir }}/build-hip", --target, llama-server, llama-cli, llama-bench, -j, "{{ llama_build_jobs | string }}"]
  register: llama_hip_build
  changed_when: llama_hip_build.stdout is search('(?m)^\[[0-9]+/[0-9]+\] (Building|Linking) ')
  notify: Restart llama
  when: not ansible_check_mode

- name: llama.backends.verify | Require a GPU in each build
  ansible.builtin.command:
    argv: ["{{ llama_source_dir }}/build-{{ item }}/bin/llama-server", --list-devices]
  loop: [vulkan, hip]
  register: llama_devices
  changed_when: false
  failed_when: >-
    llama_devices.rc != 0 or
    llama_devices.stdout is not search(('Vulkan' if item == 'vulkan' else 'ROCm') ~ '[0-9]+:')
  when: not ansible_check_mode

- name: llama.model.prepare | Prepare a dedicated model directory
  ansible.builtin.file:
    path: "{{ llama_model_dir }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    mode: '0755'
  become: true

- name: llama.model.download | Download and verify the pinned model
  ansible.builtin.get_url:
    url: "{{ llama_model_url }}"
    dest: "{{ llama_model_dir }}/{{ llama_model_file }}"
    checksum: "sha256:{{ llama_model_sha256 }}"
    mode: '0644'
    timeout: 60
  notify: Restart llama
  when: not ansible_check_mode

- name: llama.sidecars.download | Download and verify enabled model sidecars
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ llama_model_dir }}/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: '0644'
    timeout: 60
  loop:
    - { file: "{{ llama_mmproj_file }}", url: "{{ llama_mmproj_url }}", sha256: "{{ llama_mmproj_sha256 }}", enabled: "{{ llama_vision }}" }
    - { file: "{{ llama_mtp_file }}", url: "{{ llama_mtp_url }}", sha256: "{{ llama_mtp_sha256 }}", enabled: "{{ llama_mtp }}" }
  loop_control:
    label: "{{ item.file }}"
  notify: Restart llama
  when:
    - not ansible_check_mode
    - item.enabled | bool

- name: llama.user.create | Create the service user with GPU access
  ansible.builtin.user:
    name: "{{ llama_service_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: [render, video]
    append: true
  become: true

- name: llama.state.prepare | Prepare the service cache directory
  ansible.builtin.file:
    path: "{{ llama_state_dir }}"
    state: directory
    owner: "{{ llama_service_user }}"
    group: "{{ llama_service_user }}"
    mode: '0755'
  become: true
  when: not ansible_check_mode

- name: llama.systemd.write | Write the selected backend service
  ansible.builtin.template:
    src: llama.service.j2
    dest: /etc/systemd/system/llama.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart llama

- name: llama.systemd.reload | Apply service changes
  ansible.builtin.meta: flush_handlers

- name: llama.systemd.start | Enable and start llama.cpp
  ansible.builtin.systemd_service:
    name: llama.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode

- name: llama.health.verify | Wait for the model to load
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_port }}/health"
  register: llama_health
  until: llama_health.status == 200
  retries: 60
  delay: 5
  when: not ansible_check_mode

- name: llama.runtime.verify | Verify concurrency and context
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_port }}/props"
  register: llama_runtime
  failed_when: >-
    llama_runtime.status != 200 or
    llama_runtime.json.total_slots != llama_parallel | int or
    llama_runtime.json.default_generation_settings.n_ctx != llama_context | int // llama_parallel | int
  when: not ansible_check_mode

- name: llama.models.verify | Verify the served model
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_port }}/v1/models"
  register: llama_models
  failed_when: llama_models.status != 200 or llama_model_alias not in (llama_models.json.data | map(attribute='id') | list)
  when: not ansible_check_mode

- name: llama.inference.verify | Verify text generation
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_port }}/v1/chat/completions"
    method: POST
    body_format: json
    body:
      model: "{{ llama_model_alias }}"
      messages:
        - role: user
          content: What is 2 + 2? Answer with just the number.
      temperature: 0
      max_tokens: 32
    timeout: 180
  register: llama_inference
  failed_when: >-
    llama_inference.status != 200 or
    (llama_inference.json.choices[0].message.content | default('') | trim) != '4'
  when: not ansible_check_mode

- name: llama.inference.report | Report the backend and response
  ansible.builtin.debug:
    msg:
      backend: "{{ llama_backend }}"
      response: "{{ llama_inference.json.choices[0].message.content }}"
      timings: "{{ llama_inference.json.timings | default({}) }}"
  when: not ansible_check_mode

- name: llama.service.inspect | Identify the current service invocation
  ansible.builtin.command:
    argv: [systemctl, show, llama.service, --property=InvocationID, --value]
  register: llama_invocation
  changed_when: false
  when: not ansible_check_mode

- name: llama.offload.verify | Require all model layers on the selected GPU backend
  ansible.builtin.command:
    argv: [journalctl, "_SYSTEMD_INVOCATION_ID={{ llama_invocation.stdout | trim }}", --no-pager, -o, cat]
  register: llama_log
  changed_when: false
  failed_when: >-
    llama_log.rc != 0 or
    llama_log.stdout is not search('offloaded ([1-9][0-9]*)/\\1 layers to GPU') or
    (llama_log.stdout | regex_findall('offloaded [0-9]+/[0-9]+ layers to GPU') | length) !=
    (llama_log.stdout | regex_findall('offloaded ([1-9][0-9]*)/\\1 layers to GPU') | length) or
    (llama_mtp | bool) != (llama_log.stdout is search('adding speculative implementation.*draft-mtp')) or
    llama_log.stdout is not search(('Vulkan' if llama_backend == 'vulkan' else 'ROCm') ~ '[0-9]+.*model buffer size')
  become: true
  when: not ansible_check_mode
