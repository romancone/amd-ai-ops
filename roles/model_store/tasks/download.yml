---
- name: llama.model.prepare | Prepare a dedicated model directory
  ansible.builtin.file:
    path: "{{ model_store_root }}/{{ model.name }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    mode: '0755'
  become: true

- name: Download model and optional BF16 projector
  ansible.builtin.include_tasks: artifact.yml
  vars:
    artifact_sha256: "{{ model.sha256 | default('') if artifact_file == model.file else model.mmproj_sha256 | default('') }}"
  loop: "{{ [model.file] + ([model.mmproj] if model.mmproj is defined else []) }}"
  loop_control:
    loop_var: artifact_file
