---
- name: amd.rocm.smoke.settings.require | Require a safe GPU compiler target
  ansible.builtin.assert:
    that:
      - rocm_smoke_test_gfx_target is match('^gfx[0-9a-f]+$')

- name: amd.rocm.smoke.pending | Report compute verification deferred in check mode
  ansible.builtin.debug:
    msg: HIP compilation and GPU execution are skipped in check mode; compute is not verified.
  when: ansible_check_mode

- when: not ansible_check_mode
  block:
    - name: amd.rocm.smoke.workspace | Create a temporary compute-test directory
      ansible.builtin.tempfile:
        state: directory
        prefix: rocm-smoke-
      register: rocm_smoke_workspace
      changed_when: false

    - name: amd.rocm.smoke.source | Write the HIP compute test
      ansible.builtin.copy:
        src: vector_add.cpp
        dest: "{{ rocm_smoke_workspace.path }}/vector_add.cpp"
        mode: "0600"
      changed_when: false

    - name: amd.rocm.smoke.compile | Compile for the configured GPU architecture
      ansible.builtin.command:
        argv:
          - timeout
          - "120"
          - /usr/bin/hipcc
          - -std=c++17
          - "--offload-arch={{ rocm_smoke_test_gfx_target }}"
          - "{{ rocm_smoke_workspace.path }}/vector_add.cpp"
          - -o
          - "{{ rocm_smoke_workspace.path }}/vector_add"
      changed_when: false

    - name: amd.rocm.smoke.run | Execute and verify the HIP kernel
      ansible.builtin.command:
        argv:
          - timeout
          - "60"
          - "{{ rocm_smoke_workspace.path }}/vector_add"
          - "{{ rocm_smoke_test_gfx_target }}"
      register: rocm_smoke_result
      changed_when: false

    - name: amd.rocm.smoke.report | Report the verified compute result
      ansible.builtin.debug:
        var: rocm_smoke_result.stdout

  always:
    - name: amd.rocm.smoke.cleanup | Remove temporary compute-test files
      ansible.builtin.file:
        path: "{{ rocm_smoke_workspace.path }}"
        state: absent
      when: rocm_smoke_workspace is defined and rocm_smoke_workspace.path is defined
      changed_when: false
