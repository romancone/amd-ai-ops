---
- name: amd.cleanup.settings.require | Validate cleanup settings
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - rocm_cleanup_source_pattern is string
      - rocm_cleanup_dependency_sources is sequence and rocm_cleanup_dependency_sources is not string
      - rocm_cleanup_roots is sequence and rocm_cleanup_roots is not string
      - rocm_cleanup_roots | reject('match', '^/opt/rocm-[0-9]+\.[0-9]+\.[0-9]+$') | list | length == 0
      - rocm_cleanup_files is sequence and rocm_cleanup_files is not string

- name: amd.cleanup.packages.inspect | Discover ROCm packages and leftover configuration
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${binary:Package}\t${source:Package}\t${db:Status-Status}\n']
  register: rocm_cleanup_package_status
  changed_when: false
  check_mode: false

- name: amd.cleanup.metadata | Read package name, source and state
  ansible.builtin.set_fact:
    rocm_cleanup_inventory: >-
      {{ rocm_cleanup_package_status.stdout
         | regex_findall('(?m)^([^\t\n]+)\t([^\t\n]*)\t(installed|config-files)$') }}

- name: amd.cleanup.selection | Select packages by their source metadata
  ansible.builtin.set_fact:
    rocm_cleanup_installed: >-
      {{ rocm_cleanup_inventory
         | selectattr('1', 'match', rocm_cleanup_source_pattern)
         | map('first') | map('regex_replace', ':.*$', '') | unique | sort }}
    rocm_cleanup_allowed_dependencies: >-
      {{ rocm_cleanup_inventory
         | selectattr('1', 'in', rocm_cleanup_dependency_sources)
         | map('first') | map('regex_replace', ':.*$', '') | unique | sort }}
    rocm_cleanup_removals: []

- name: amd.cleanup.transaction.inspect | Preview the discovered ROCm package purge
  ansible.builtin.command:
    argv: "{{ ['apt-get', '--simulate', 'purge'] + rocm_cleanup_installed }}"
  environment:
    LC_ALL: C
  register: rocm_cleanup_transaction
  changed_when: false
  check_mode: false
  become: true
  when: rocm_cleanup_installed | length > 0

- name: amd.cleanup.transaction.select | Record the proposed removals
  ansible.builtin.set_fact:
    rocm_cleanup_removals: >-
      {{ rocm_cleanup_transaction.stdout | regex_findall('(?m)^(?:Remv|Purg) ([^\s:]+)') | unique | sort }}
  when: rocm_cleanup_installed | length > 0

- name: amd.cleanup.transaction.require | Reject unrelated package changes
  ansible.builtin.assert:
    that:
      - rocm_cleanup_transaction.stdout is not search('(?m)^Inst ')
      - rocm_cleanup_removals | difference(rocm_cleanup_installed + rocm_cleanup_allowed_dependencies) | length == 0
      - rocm_cleanup_removals | select('match', '^(linux-|amdgpu|mesa-|libdrm|libvulkan|vulkan-)') | list | length == 0
    fail_msg: APT proposes changes outside ROCm and its supported communication dependencies; no packages were removed.
  when: rocm_cleanup_installed | length > 0

- name: amd.cleanup.packages.report | Show packages selected for removal
  ansible.builtin.debug:
    var: rocm_cleanup_removals

- name: amd.cleanup.packages.remove | Purge the discovered ROCm packages
  ansible.builtin.apt:
    name: "{{ rocm_cleanup_removals }}"
    state: absent
    purge: true
    autoremove: false
    force_apt_get: true
    auto_install_module_deps: false
  become: true
  when: rocm_cleanup_removals | length > 0

- name: amd.cleanup.packages.verify | Check package status after cleanup
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${binary:Package}\t${db:Status-Status}\n']
  register: rocm_cleanup_remaining
  changed_when: false
  when: not ansible_check_mode

- name: amd.cleanup.absent.require | Require discovered packages and configuration to be absent
  ansible.builtin.assert:
    that:
      - >-
        rocm_cleanup_removals | intersect(rocm_cleanup_remaining.stdout
        | regex_findall('(?m)^([^:\t]+)(?::[^\t]+)?\t(?:installed|config-files)$')) | length == 0
  when: not ansible_check_mode

- name: amd.cleanup.files.require | Require exact paths inside the selected legacy roots
  ansible.builtin.assert:
    that:
      - item is match('^/opt/rocm-[0-9]+\.[0-9]+\.[0-9]+/[a-zA-Z0-9_./+-]+$')
      - "'..' not in item"
      - item | regex_search('^/opt/rocm-[0-9]+\.[0-9]+\.[0-9]+') in rocm_cleanup_roots
  loop: "{{ rocm_cleanup_files }}"

- name: amd.cleanup.files.inspect | Inspect explicitly selected leftover files
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    follow: false
  loop: "{{ rocm_cleanup_files }}"
  register: rocm_cleanup_file_stats
  failed_when: rocm_cleanup_file_stats.stat.exists and not (rocm_cleanup_file_stats.stat.isreg | default(false))

- name: amd.cleanup.files.canonical | Reject paths through symbolic links
  ansible.builtin.command:
    argv: [realpath, -e, "{{ item.item }}"]
  loop: "{{ rocm_cleanup_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: rocm_cleanup_canonical
  changed_when: false
  check_mode: false
  failed_when: rocm_cleanup_canonical.rc != 0 or rocm_cleanup_canonical.stdout != item.item
  when: item.stat.exists

- name: amd.cleanup.files.ownership | Reject package-owned leftover files
  ansible.builtin.command:
    argv: [dpkg-query, -S, "{{ item.item }}"]
  loop: "{{ rocm_cleanup_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: rocm_cleanup_owner
  changed_when: false
  check_mode: false
  failed_when: rocm_cleanup_owner.rc != 1
  when: item.stat.exists

- name: amd.cleanup.files.remove | Remove explicitly selected unowned legacy files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ rocm_cleanup_files }}"
  become: true

- name: amd.cleanup.roots.inspect | Inspect the selected legacy directories
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    follow: false
  loop: "{{ rocm_cleanup_roots }}"
  register: rocm_cleanup_root_stats
  failed_when: rocm_cleanup_root_stats.stat.exists and not (rocm_cleanup_root_stats.stat.isdir | default(false))

- name: amd.cleanup.directories.remove | Prune empty legacy directories
  ansible.builtin.command:
    argv: [find, "{{ item.item }}", -depth, -type, d, -empty, -print, -delete]
  loop: "{{ rocm_cleanup_root_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: rocm_cleanup_empty_dirs
  changed_when: rocm_cleanup_empty_dirs.stdout | length > 0
  become: true
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: amd.cleanup.roots.verify | Check for leftover legacy installation files
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    follow: false
  loop: "{{ rocm_cleanup_roots }}"
  register: rocm_cleanup_root
  failed_when: rocm_cleanup_root.stat.exists
  when: not ansible_check_mode

- name: amd.cleanup.report | Report cleanup scope
  ansible.builtin.debug:
    msg: "{{ 'Cleanup preview complete; nothing was removed.' if ansible_check_mode else 'Selected packages and leftover files are absent.' }}"

- name: amd.cleanup.vulkan.verify | Verify Vulkan hardware remains available
  ansible.builtin.command:
    argv: [vulkaninfo, --summary]
  environment:
    LC_ALL: C
  register: rocm_cleanup_vulkan
  changed_when: false
  failed_when: >-
    rocm_cleanup_vulkan.rc != 0 or
    rocm_cleanup_vulkan.stdout is not search('deviceType\s*=\s*PHYSICAL_DEVICE_TYPE_(DISCRETE|INTEGRATED)_GPU')
  when:
    - not ansible_check_mode
    - rocm_cleanup_verify_vulkan | bool
