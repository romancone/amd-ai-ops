---
- name: amd.rocm.transaction.validate | Reject changes outside the reviewed migration
  ansible.builtin.assert:
    that:
      - rocm_transaction.rc == 0
      - >-
        (rocm_transaction.stdout | regex_findall('(?m)^Remv ([^ ]+)')
        | difference(rocm_legacy_packages) | length) == 0
      - >-
        rocm_transaction.stdout is not search('(?m)^Inst (amdgpu-dkms|linux-(image|headers|modules|generic))')
      - >-
        rocm_transaction.stdout is not search('(?m)^Inst \S+ \[')
      - >-
        (rocm_transaction.stdout | regex_findall('(?m)^Inst .+$')
        | reject('search', 'Ubuntu:') | list | length) == 0
    fail_msg: >-
      APT proposes an unexpected removal, installed-package upgrade, driver/kernel
      change, or non-Ubuntu package. Review the simulation before continuing.
