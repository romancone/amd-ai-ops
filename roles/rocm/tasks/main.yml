---
- name: amd.rocm.settings.require | Require Ubuntu and ROCm settings
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == rocm_ubuntu_version
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.user_id != 'root'
      - rocm_expected_gfx_target is match('^gfx[0-9a-f]+$')
      - rocm_profile_packages is sequence and rocm_profile_packages is not string
      - rocm_profile_packages | length > 0
      - rocm_profile_packages | select('match', '^[a-z0-9][a-z0-9+.-]*$') | list | length == rocm_profile_packages | length
    fail_msg: Configure the Ubuntu release, GPU and packages, and connect as the non-root compute user.

- name: amd.driver.inspect.loaded | Require the loaded AMDGPU driver
  ansible.builtin.stat:
    path: /sys/module/amdgpu
    get_checksum: false
  register: rocm_loaded_driver
  failed_when: not rocm_loaded_driver.stat.exists

- name: amd.driver.inspect.module | Require the distribution kernel module
  ansible.builtin.command:
    argv: [modinfo, -F, filename, amdgpu]
  register: rocm_module
  changed_when: false
  check_mode: false
  failed_when: >-
    rocm_module.rc != 0 or
    '/kernel/drivers/gpu/drm/amd/amdgpu/' not in rocm_module.stdout or
    '/updates/' in rocm_module.stdout

- name: amd.driver.access.inspect | Inspect compute-user access to KFD
  ansible.builtin.stat:
    path: /dev/kfd
    get_checksum: false
  register: rocm_kfd

- name: amd.driver.render.find | Find GPU render devices
  ansible.builtin.find:
    paths: /dev/dri
    patterns: renderD*
    file_type: any
  register: rocm_render_devices

- name: amd.driver.render.inspect | Inspect compute-user access to render devices
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
  loop: "{{ rocm_render_devices.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: rocm_render_access

- name: amd.driver.verify.access | Require compute-user access to KFD and a render device
  ansible.builtin.assert:
    that:
      - rocm_kfd.stat.exists
      - rocm_kfd.stat.ischr | default(false)
      - rocm_kfd.stat.readable | default(false)
      - rocm_kfd.stat.writeable | default(false)
      - >-
        rocm_render_access.results | map(attribute='stat')
        | selectattr('ischr', 'defined') | selectattr('ischr')
        | selectattr('readable') | selectattr('writeable') | list | length > 0
    fail_msg: The compute user needs read/write access to /dev/kfd and a GPU render device; review device permissions.

- name: amd.rocm.cache.refresh | Refresh Ubuntu package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ rocm_cache_valid_time }}"
    auto_install_module_deps: false
  become: true

- name: amd.rocm.transaction.inspect | Simulate the Ubuntu ROCm installation
  ansible.builtin.command:
    argv: >-
      {{ ['apt-get', '--simulate', '--no-remove', 'install', 'rocminfo'] + rocm_profile_packages }}
  environment:
    LC_ALL: C
  register: rocm_transaction
  changed_when: false
  check_mode: false
  become: true

- name: amd.rocm.transaction.validate | Reject changes outside the ROCm installation
  ansible.builtin.assert:
    that:
      - rocm_transaction.stdout is not search('(?m)^Remv ')
      - rocm_transaction.stdout is not search('(?m)^Inst (amdgpu-dkms|linux-(image|headers|modules|generic))')
      - rocm_transaction.stdout | regex_findall('(?m)^Inst .+$') | reject('search', 'Ubuntu:') | list | length == 0
    fail_msg: APT proposes removals, driver/kernel changes or non-Ubuntu packages; resolve these separately.

- name: amd.rocm.discovery.install | Install ROCm discovery without removals
  ansible.builtin.apt:
    name: rocminfo
    state: latest
    fail_on_autoremove: true
    force_apt_get: true
    auto_install_module_deps: false
  become: true

- name: amd.rocm.inspect.agents | Require the expected ROCm GPU agent
  ansible.builtin.command:
    argv: [/usr/bin/rocminfo]
  environment:
    LC_ALL: C
  register: rocm_agents
  changed_when: false
  failed_when: >-
    rocm_agents.rc != 0 or
    rocm_agents.stdout is not search('(?m)^\s*Name:\s+' ~ rocm_expected_gfx_target ~ '\s*$')
  when: not ansible_check_mode

- name: amd.rocm.install | Install the Ubuntu ROCm development profile
  ansible.builtin.apt:
    name: "{{ rocm_profile_packages }}"
    state: latest
    fail_on_autoremove: true
    force_apt_get: true
    auto_install_module_deps: false
  become: true

- name: amd.rocm.compiler.verify | Verify HIP compiler availability
  ansible.builtin.command:
    argv: [/usr/bin/hipcc, --version]
  register: rocm_compiler
  changed_when: false
  when: not ansible_check_mode

- name: amd.rocm.verify.report | Report GPU and compiler visibility
  ansible.builtin.debug:
    msg:
      - "GPU agent: {{ rocm_expected_gfx_target }}"
      - "{{ rocm_compiler.stdout }}"
  when: not ansible_check_mode

- name: amd.rocm.reboot.report | Remind the operator to reboot manually
  ansible.builtin.debug:
    msg: Reboot the host manually after installation, then rerun the playbook to repeat GPU verification.
  when: not ansible_check_mode
