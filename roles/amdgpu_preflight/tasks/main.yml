---
- name: amd.driver.settings.require | Require the configured Ubuntu compute host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version in amdgpu_preflight_ubuntu_versions
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.user_id == amdgpu_preflight_compute_user
      - amdgpu_preflight_pci_id is match('^[0-9a-fA-F]{4}:[0-9a-fA-F]{4}$')
    fail_msg: Run as the intended compute user on a configured Ubuntu x86_64 host.

- name: amd.driver.inspect.pci | Require the expected GPU on amdgpu
  ansible.builtin.command:
    argv: [lspci, -nnk, -d, "{{ amdgpu_preflight_pci_id }}"]
  environment:
    LC_ALL: C
  register: amdgpu_pci
  changed_when: false
  check_mode: false
  failed_when: >-
    amdgpu_pci.rc != 0 or
    'Kernel driver in use: amdgpu' not in amdgpu_pci.stdout

- name: amd.driver.inspect.module | Require the distribution kernel module
  ansible.builtin.command:
    argv: [modinfo, -F, filename, amdgpu]
  register: amdgpu_module
  changed_when: false
  check_mode: false
  failed_when: >-
    amdgpu_module.rc != 0 or
    '/kernel/drivers/gpu/drm/amd/amdgpu/' not in amdgpu_module.stdout or
    '/updates/' in amdgpu_module.stdout

- name: amd.driver.verify.access | Require compute-user access to the matching GPU
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/check_access.py') }}"
      - "{{ amdgpu_preflight_pci_id }}"
  changed_when: false
  check_mode: false
