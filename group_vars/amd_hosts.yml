---
rocm_ubuntu_version: "26.04"
rocm_expected_gfx_target: gfx1030
rocm_profile_packages:
  - rocm-dev
  - rocm-smi
rocm_python_packages:
  - python3-torch-rocm
rocm_python_preload: /usr/lib/x86_64-linux-gnu/libamd_comgr.so.3

models:  # Models to download
  - name: gemma-4-12B-it-Q4_0
    repo: ggml-org/gemma-4-12B-it-GGUF
    file: gemma-4-12B-it-Q4_0.gguf
    draft: mtp-gemma-4-12B-it-Q4_0.gguf  # Matching Q4 MTP draft
    mmproj: mmproj-gemma-4-12B-it-BF16.gguf  # BF16 images
    # mmproj_sha256: 9b1edfa05b634728ca4bfd60b4e6b278e95166c078fa54ae4fa83e680112fd1d  # Optional projector checksum
    # revision: <commit-or-tag>  # Optional; must contain all selected files
    # sha256: 3712b9bd32cae83a22f67ee7a4466d8d7a4f21646ac8a07d19bf9418e8767a70  # Optional checksum

  # - name: gemma-4-E4B-it-Q4_0  # Optional download; uncomment this entry to include it
  #   repo: ggml-org/gemma-4-E4B-it-GGUF
  #   file: gemma-4-E4B-it-Q4_0.gguf
  #   draft: mtp-gemma-4-E4B-it-Q4_0.gguf
  #   mmproj: mmproj-gemma-4-E4B-it-BF16.gguf

  # - name: Qwen3.5-9B-MTP-Q4_K_M  # Optional download; settings in MODELS.md
  #   repo: unsloth/Qwen3.5-9B-MTP-GGUF
  #   file: Qwen3.5-9B-Q4_K_M.gguf
