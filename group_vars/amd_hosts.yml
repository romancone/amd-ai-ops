  #   mmproj: mmproj-BF16.gguf  # BF16 images

llama_model: gemma-4-12B-it-Q4_0  # Name of the model to serve
llama_backend: hip
llama_mtp: true
llama_draft_tokens: 3
llama_kv_unified: true
llama_context: 16384  # Total allocation across llama_parallel users
llama_parallel: 1
llama_threads: 10
llama_flash_attention: "on"
llama_cache_type_k: f16
llama_cache_type_v: f16
llama_batch: 2048
llama_ubatch: 1152
llama_image_min_tokens: 70  # Gemma BF16 image profile
llama_image_max_tokens: 1120
# Profiles for 1, 2 and 4 users: MODELS.md
